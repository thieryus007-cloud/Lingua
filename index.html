  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Apprentissage visuel de vocabulaire Franco-Italien avec Gemini AI. Générez des mots, révisez avec des images, testez vos connaissances." />
    <meta name="theme-color" content="#6366f1" />

    <!-- PWA Manifest -->

    <!-- Tailwind CSS -->

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: white;
      }
      .font-serif {
        font-family: 'Playfair Display', serif;
      }

      /* Animations */
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slowZoom {
        from {
          transform: scale(1);
        }
        to {
          transform: scale(1.1);
        }
      }

      .animate-fadeIn {
        animation: fadeIn 0.5s ease-in;
      }

      .animate-slowZoom {
        animation: slowZoom 6s ease-in-out infinite alternate;
      }
    </style>
